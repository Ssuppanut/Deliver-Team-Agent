component: RadioGroup
purpose: A labeled single-select radio group over a list of options, controlled by a bound value.
audience: End users choosing one of N options as radios.
platforms: [react, vue, svelte, react-native, swiftui, compose]
variants: []
states: [default]
interaction: [controlled]
a11y:
  - "role=radiogroup on the group; radio semantics per option"
  - "single-select via each platform's native grouped-selection construct (no spec expression)"
  - "accessible group name via aria-label / accessibilityLabel"
scope:
  in:
    - "controlled selected value + onChange (control-state selected-value)"
    - "radiogroup/radio roles + option children"
  out:
    - "rich/nested option children (value+label only)"
