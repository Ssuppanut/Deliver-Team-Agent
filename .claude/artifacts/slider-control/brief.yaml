component: SliderControl
purpose: A labeled range slider with a controlled numeric value and min/max/step constraints.
audience: End users choosing a value in a range.
platforms: [react, vue, svelte, react-native, swiftui, compose]
variants: []
states: [default]
interaction: controlled
a11y:
  - "role=slider with the current value exposed (aria-valuenow / accessibilityValue)"
  - "visible label as the accessible name"
scope:
  in:
    - "controlled numeric value + onChange (control-state primitive: kind=numeric-range)"
    - "min/max/step constraints"
    - "slider role across all 6 adapters"
  out:
    - "value display formatting (F-11/F-12 — a distinct concern)"
composes: "control-state(numeric-range) + role=slider a11y + tokens"
