component: Avatar
description: User image with a true initials fallback (if hasImage → image, else → initials).
category: display
props:
  - { name: name, type: string, required: true }
  - { name: hasImage, type: boolean, required: true }
  - { name: src, type: string, required: true }
  - { name: initials, type: string, required: true }
tokens:
  - color.bg.muted
  - color.fg.muted
  - radius.full
root:
  el: container
  role: img
  a11y:
    label: { kind: ref, value: name }
  style:
    background: color.bg.muted
    radius: radius.full
  children:
    - el: conditional
      when: hasImage
      then:
        el: media
        src: { kind: ref, value: src }
        alt: { kind: ref, value: name }
        style:
          radius: radius.full
      else:
        el: text
        text: { kind: ref, value: initials }
        style:
          color: color.fg.muted
