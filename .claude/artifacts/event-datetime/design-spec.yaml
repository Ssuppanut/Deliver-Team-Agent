component: EventDateTime
description: F-26 date/time — static en-GB locale, medium date + short time preset via native date formatter.
category: display
props:
  - { name: when, type: date, required: true }
tokens:
  - color.fg.default
root:
  el: text
  text:
    kind: datetime
    value: when
    dateFormat:
      dateStyle: medium
      timeStyle: short
      locale: en-GB
  style:
    color: color.fg.default
