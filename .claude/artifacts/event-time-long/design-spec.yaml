component: EventTimeLong
description: F-26 date/time — static en-GB locale, short date + long time preset via native date formatter.
category: display
props:
  - { name: when, type: date, required: true }
tokens:
  - color.fg.default
root:
  el: text
  text:
    kind: datetime
    value: when
    dateFormat:
      dateStyle: short
      timeStyle: long
      locale: en-GB
  style:
    color: color.fg.default
