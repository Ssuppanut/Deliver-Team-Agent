# Artifact registry — agents communicate through structured artifacts, not chat
# history. Each artifact declares its owner (agent), the stage that produces it,
# the schema that validates it, its upstream lineage (`inputs`, for traceability),
# and an honest status. Existing schemas are reused; new ones are marked planned.
#
# required-vs-optional is an EDGE property, not an artifact property: whether an
# artifact is required or optional depends on WHICH stage consumes it, so it lives
# on `workflows/ux-ui.workflow.yaml` `consumes[].required` / `.reuse`. `inputs`
# here is lineage (what informed this artifact), not an execution dependency.
# `produced_by` must match the workflow stage that emits the artifact (validated).
version: 2

artifacts:
  - id: brief
    owner: orchestrator
    produced_by: intake
    inputs: []
    schema: { status: implemented, path: "_shared/schemas/brief.schema.yaml" }
    status: implemented
    note: "Request -> structured brief (existing 01-discover output)."

  - id: product-spec
    owner: product-ux-strategist
    produced_by: product-strategy
    inputs: [brief]
    schema: { status: planned, path: "artifacts/schemas/product-spec.schema.yaml" }
    status: planned
    note: "Reusable: if a product strategy already exists it is supplied and product-strategy is skipped."

  - id: research-report
    owner: ux-researcher
    produced_by: research
    inputs: [product-spec, brief]
    schema: { status: planned, path: "artifacts/schemas/research-report.schema.yaml" }
    status: planned
    note: "Reusable: an existing research report is reused instead of re-running research."

  - id: ux-spec
    owner: ux-designer
    produced_by: ux-design
    inputs: [research-report, product-spec]
    schema: { status: planned, path: "artifacts/schemas/ux-spec.schema.yaml" }
    status: planned
    note: "May extend _shared/schemas/architecture.schema.yaml rather than a new format."

  - id: design-spec
    owner: ui-designer
    produced_by: ui-design
    inputs: [ux-spec]
    schema: { status: implemented, path: "_shared/schemas/design-spec.schema.yaml" }
    status: implemented
    note: "Single source of truth driving all 6 adapters. Reusable: a supplied design-spec skips UX/UI design."

  - id: design-tokens
    owner: design-system
    produced_by: design-system
    inputs: []
    schema: { status: implemented, path: "_shared/tokens/registry.json" }
    status: implemented
    note: "Built by tokens-dtcg; components consume semantic tokens only. Reusable from an existing design system."

  - id: component-contracts
    owner: design-system
    produced_by: design-system
    inputs: [design-spec]
    schema: { status: implemented, path: "_shared/schemas/design-spec.schema.yaml" }
    status: implemented
    note: "The prop set every adapter must expose identically (parity contract)."

  - id: prototype
    owner: ux-ui-engineer
    produced_by: engineering
    inputs: [design-spec, design-tokens, component-contracts]
    schema: { status: generated, path: "out/<adapter>/<feature>" }   # runtime output, not a static schema file
    status: implemented
    note: "Generated code per adapter + e2e report. Absent for design-only projects (engineering skipped)."

  - id: design-qa-report
    owner: design-qa
    produced_by: design-qa
    inputs: [prototype, design-spec]
    schema: { status: implemented, path: "_shared/schemas/verify-report.schema.yaml" }
    status: implemented
    note: "The e2e/verify report. Absent for design-only projects (design-qa skipped)."

  - id: handoff
    owner: ux-ui-engineer
    produced_by: handoff
    inputs: [design-spec, prototype, design-qa-report]
    schema: { status: planned, path: "artifacts/schemas/handoff.schema.yaml" }
    status: implemented
    note: "Handoff bundle. Requires design-spec only; prototype + design-qa-report are optional, so design-only handoff is valid."

  - id: project-state
    owner: orchestrator
    produced_by: orchestrator-state   # cross-cutting orchestrator state, not a pipeline stage output
    inputs: []
    schema: { status: planned, path: "artifacts/schemas/project-state.schema.yaml" }
    status: planned
    note: "current_stage, completed_stages, pending/blocked tasks, artifacts, approvals, decisions, open_questions, risks, quality_results."

# Traceability chain the registry is designed to support:
#   stakeholder-requirement -> product-requirement -> research-insight ->
#   ux-decision -> ui-decision -> design-component -> design-spec -> handoff
traceability:
  chain: [brief, product-spec, research-report, ux-spec, design-spec, component-contracts, prototype, design-qa-report, handoff]
