$schema: "http://json-schema.org/draft-07/schema#"
$id: "brief.schema.yaml"
title: Component Brief
description: Output of 01-discover. Structured intent before architecture.
type: object
additionalProperties: false
required: [component, purpose, platforms]
properties:
  component: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
  purpose: { type: string }
  audience: { type: string }
  platforms:
    type: array
    minItems: 1
    items: { type: string, enum: [react, vue, svelte, react-native, swiftui, compose] }
  variants:
    type: array
    items: { type: string }
  states:
    type: array
    description: >
      Free-identifier state names in lower-kebab-case (e.g. default, loading,
      with-image, unchecked). No closed enum — real components name states the
      design needs. `default` is allowed and implicit; it is not required.
    items: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
  interaction:
    type: array
    description: >
      One or more interaction modes the component exhibits, derived from its
      design-spec shape. `static` describes a component with no interaction and
      therefore cannot be combined with any other value.
    minItems: 1
    uniqueItems: true
    items: { type: string, enum: [static, variants, controlled, iteration, conditional] }
    if:
      contains: { const: static }
    then:
      maxItems: 1
  a11y:
    type: array
    items: { type: string }
  scope:
    type: object
    additionalProperties: false
    properties:
      in: { type: array, items: { type: string } }
      out: { type: array, items: { type: string } }
  research:
    type: object
    description: Optional findings appended by 02-research.
    additionalProperties: true
