$schema: "http://json-schema.org/draft-07/schema#"
$id: "brief.schema.yaml"
title: Component Brief
description: Output of 01-discover. Structured intent before architecture.
type: object
additionalProperties: false
required: [component, purpose, platforms]
properties:
  component: { type: string, pattern: "^[A-Z][A-Za-z0-9]*$" }
  purpose: { type: string }
  audience: { type: string }
  platforms:
    type: array
    minItems: 1
    items: { type: string, enum: [react, vue, svelte, react-native, swiftui, compose] }
  variants:
    type: array
    items: { type: string }
  states:
    type: array
    items: { type: string, enum: [default, loading, error, empty, disabled, selected] }
  interaction:
    type: string
    enum: [static, variants, controlled, iteration]
  a11y:
    type: array
    items: { type: string }
  scope:
    type: object
    additionalProperties: false
    properties:
      in: { type: array, items: { type: string } }
      out: { type: array, items: { type: string } }
  research:
    type: object
    description: Optional findings appended by 02-research.
    additionalProperties: true
