$schema: "http://json-schema.org/draft-07/schema#"
$id: "design-spec.schema.yaml"
title: Design Spec
description: >
  Platform-neutral description of a single component. Normalized by
  spec-to-ir.mjs into an Intermediate Representation, then rendered by each
  adapter. Elements are classified into 8 kinds; props carry an explicit kind
  (literal | ref | expr) so adapters know how to emit them.
type: object
additionalProperties: false
required: [component, root]
properties:
  component:
    type: string
    pattern: "^[A-Z][A-Za-z0-9]*$"
    description: PascalCase component name.
  description:
    type: string
  category:
    type: string
    description: >
      Optional category hint. The orchestrator refuses "overlay" and
      "data-table" categories and redirects to headless primitives.
    enum: [display, feedback, input, navigation, layout, overlay, data-table]
  props:
    type: array
    items: { $ref: "#/definitions/prop" }
  tokens:
    type: array
    description: Semantic token names this component is allowed to consume.
    items: { type: string }
  root:
    $ref: "#/definitions/element"

definitions:
  prop:
    type: object
    additionalProperties: false
    required: [name, type]
    properties:
      name: { type: string, pattern: "^[a-z][A-Za-z0-9]*$" }
      type:
        type: string
        enum: [string, number, boolean, enum, array, function, node, date]
      required: { type: boolean }
      values:
        type: array
        description: Allowed values when type is enum.
        items: { type: string }
      itemShape:
        type: object
        description: Shape of each item when type is array (for iteration).
        additionalProperties: { type: string }

  valueRef:
    type: object
    additionalProperties: false
    required: [kind, value]
    properties:
      kind: { type: string, enum: [literal, ref, expr, format, datetime] }
      value: {}
      format:
        $ref: "#/definitions/numberFormat"
        description: >
          Number-formatting descriptor (kind=format only). `value` is the number
          source (a numeric literal or a plain prop ref). Precision (F-11) plus
          the four F-12 dimensions compose into one native formatter call per
          adapter (Intl.NumberFormat / NumberFormatter / java.text.NumberFormat).
      dateFormat:
        $ref: "#/definitions/dateTimeFormat"
        description: >
          Date/time-formatting descriptor (kind=datetime only, F-26). `value` is
          the date source (a plain prop ref of a date prop). dateStyle / timeStyle
          are native presets; locale is a literal or plain prop ref. Maps to one
          native date formatter per adapter (Intl.DateTimeFormat / DateFormatter /
          java.text.DateFormat).

  dateTimeFormat:
    type: object
    additionalProperties: false
    description: >
      Native date/time-formatter options (F-26 + F-27 timezone). dateStyle /
      timeStyle use native PRESETS (short | medium | long) — never a custom pattern
      string. locale and timeZone are each a STATIC literal or a plain prop ref
      ({ kind: ref, value: <prop> }) for runtime switching; an expression as any of
      them, or as the date source, is refused (F-9). At least one of dateStyle /
      timeStyle must be given. Timezone display names (GMT+7, ICT) are not supported.
    properties:
      dateStyle: { type: string, enum: [short, medium, long], description: "Native date preset." }
      timeStyle: { type: string, enum: [short, medium, long], description: "Native time preset." }
      locale: { description: "BCP-47 locale tag: a literal (e.g. en-GB) or a plain prop ref; omitted = platform default." }
      timeZone:
        description: >
          IANA timezone id (F-27): a literal or a plain prop ref. A LITERAL must be
          the exact-case Region/City form (e.g. Asia/Bangkok, Asia/Kolkata,
          Etc/GMT-7) or UTC — the cross-platform-safe subset. Case variants
          (asia/bangkok), UTC offsets (+07:00, -0500) and display names (GMT+7) are
          rejected at validate-schema because Swift/Java (case-sensitive) would not
          resolve them identically to ICU. Omitted = device timezone (output
          byte-identical to no-timezone). An invalid runtime prop-ref value falls
          back to the device timezone identically on all 6 adapters.

  numberFormat:
    type: object
    additionalProperties: false
    description: >
      Native number-formatter options (F-11 precision + F-12 locale / currency /
      grouping / rounding). Each option is a STATIC literal or a plain prop ref
      ({ kind: ref, value: <prop> }) for runtime switching — never an expression
      (an expression as any option is refused, F-9-consistent). Only native
      formatter options are supported; custom pattern strings are out of scope.
    properties:
      style: { type: string, enum: [decimal, currency], description: "Formatter style; defaults to decimal." }
      currency: { description: "ISO 4217 code (currency style): a literal (e.g. THB) or a plain prop ref." }
      locale: { description: "BCP-47 locale tag: a literal (e.g. th-TH) or a plain prop ref; omitted = platform default." }
      grouping: { description: "Thousands grouping on/off: a boolean literal or a plain prop ref." }
      rounding: { description: "Rounding mode: literal round | floor | ceil, or a plain prop ref." }
      precision: { description: "Fraction digits (min=max): an integer literal or a plain prop ref." }

  element:
    type: object
    additionalProperties: false
    required: [el]
    properties:
      el:
        type: string
        enum: [container, media, heading, text, action, link, input, slot, icon, conditional]
      role: { type: string }
      as: { type: string, description: "Optional semantic tag hint (e.g. section, article)." }
      orientation:
        type: string
        enum: [horizontal, vertical]
        description: >
          Layout / semantic orientation of the element. On web a role-bearing
          element also carries the semantic aria-orientation; every platform
          conveys it as the container's main layout axis (row = horizontal,
          column = vertical).
      size:
        type: string
        description: >
          Dimension token name (e.g. font.size.lg, space.6) driving the
          element's width/height. MUST be a token reference — a hardcoded native
          size is rejected by token-guard. There is no dedicated size.* scale
          yet, so existing font.size.* / space.* tokens are reused.
      disabled:
        type: string
        description: >
          Boolean-attribute binding: the name of a caller-supplied boolean flag
          prop that disables the control (el=action). Must be a plain flag ref,
          never a JS expression (an expression is refused, like the F-9 variant
          discriminant and the control-state binding).
      id:
        type: string
        description: >
          Stable element id used to wire label/description associations
          (e.g. an error text referenced by an input's describedBy).
      a11y:
        type: object
        additionalProperties: false
        properties:
          label: { $ref: "#/definitions/valueRef" }
          labelledBy: { type: string }
          describedBy: { type: string, description: "Element id (or ids) to reference via aria-describedby." }
          invalid: { type: string, description: "Prop name whose truthiness toggles aria-invalid (el=input)." }
          live: { type: string, enum: [off, polite, assertive] }
      style:
        type: object
        description: Map of style slot -> semantic token name.
        additionalProperties: { type: string }
      level:
        type: integer
        minimum: 1
        maximum: 6
        description: Heading level (el=heading only).
      text: { $ref: "#/definitions/valueRef" }
      src: { $ref: "#/definitions/valueRef" }
      alt: { $ref: "#/definitions/valueRef" }
      href: { $ref: "#/definitions/valueRef" }
      icon: { type: string, description: "Icon token name (icon.*)." }
      label: { $ref: "#/definitions/valueRef" }
      variant:
        type: object
        description: Maps a prop name to a per-value style/attribute table.
        additionalProperties: false
        required: [prop, cases]
        properties:
          prop: { type: string }
          cases:
            type: object
            additionalProperties:
              type: object
              additionalProperties: { type: string }
      input:
        type: object
        description: Controlled input binding (el=input only).
        additionalProperties: false
        properties:
          valueProp: { type: string }
          changeProp: { type: string }
          inputType: { type: string, enum: [text, number, email, password, checkbox] }
          multiline:
            type: boolean
            description: >
              Textarea variant of a text input (F-19). When true a plain text
              input renders as a multi-line control (web <textarea>, RN multiline
              TextInput, SwiftUI TextField axis: .vertical, Compose singleLine =
              false). Applies to plain text inputs, not to control-state kinds.
          state:
            type: object
            description: >
              Control-state primitive (el=input only). A single-value, controlled
              (caller holds the source of truth), two-way binding. `valueProp` is
              the bound value reference and `changeProp` is the change handler
              reference; both must be plain refs, never expressions. min/max/step
              apply to numeric-range only and are input constraints, not display
              formatting (formatting is F-11/F-12, a separate concern).
            additionalProperties: false
            required: [kind]
            properties:
              kind: { type: string, enum: [boolean, selected-value, numeric-range] }
              min: { type: [number, string], description: "numeric-range lower bound: a number literal or a plain prop ref." }
              max: { type: [number, string], description: "numeric-range upper bound: a number literal or a plain prop ref." }
              step: { type: [number, string], description: "numeric-range step: a number literal or a plain prop ref (optional)." }
              options: { type: string, description: "selected-value only: plain prop ref of the option array (items { value, label, disabled? }). Options render inside the bound control (Select / RadioGroup); the control does the selection matching — no per-option expression is authored in the spec." }
      onEvent:
        type: string
        description: Prop name of the callback for el=action.
      when:
        type: string
        description: >
          Branch/gate condition. On an ordinary element it gates one-way
          rendering (show/hide); on an `el: conditional` node it is the branch
          condition. Two forms only: (1) a plain boolean flag/prop name; or (2)
          a per-item boolean FIELD-ACCESS `<loopvar>.<field>` (e.g. item.active)
          when the node is inside that iteration — a direct native property read.
          Never a JS expression (comparison / logic / call, e.g.
          `items.length > 0`, `item.count > 5`): an expression condition is
          refused, like the F-9 variant discriminant.
      then:
        $ref: "#/definitions/element"
        description: >
          The branch rendered when `when` is true (el=conditional only). May
          itself be an `el: conditional` (F-13 nested conditional).
      else:
        $ref: "#/definitions/element"
        description: >
          Optional branch rendered when `when` is false (el=conditional only). An
          `else` that is itself an `el: conditional` is an F-13 else-if chain.
          Total conditional nesting (nested + else-if + per-item, counted
          together) is capped at 3 levels; deeper nesting is refused with a
          redirect to extract a sub-component.
      each:
        type: object
        description: Iteration binding (Strategy D single-level).
        additionalProperties: false
        required: [items, as]
        properties:
          items: { type: string, description: "Array prop to iterate." }
          as: { type: string, description: "Loop variable name." }
          key: { type: string, description: "Field of each item used as key." }
      children:
        type: array
        items: { $ref: "#/definitions/element" }
