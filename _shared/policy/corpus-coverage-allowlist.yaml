# Corpus coverage allowlist (D3).
#
# Every derived schema construct (see _shared/scripts/schema-constructs.mjs) must be
# exercised by at least one corpus spec, or be listed here. check-corpus-coverage.mjs
# enforces it as a blocking CI step. An entry is a dated, approved exemption, not a
# permanent one. Format:
#
#   allowlist:
#     "<construct-id>": { reason: "<specific: why no spec covers it and what resolves it>", approver: "Ssuppanut (design-system a11y owner)", expires: "YYYY-MM-DD" }
#
# Rules: the id must be a derived construct (C2); the construct must NOT already be
# exercised by a corpus spec, otherwise delete the entry (C2); reason non-empty,
# approver exactly as above, expiry a valid future date (C3; an entry is already past
# on its own expiry date, same semantics as the trait registry and a11y-waivers.json);
# no construct listed twice (C4). To resolve an entry: add a corpus spec that uses the
# construct and delete the entry in the same change.
version: 1
allowlist:
  "a11y.field:labelledBy": { reason: "Declared ledger trait that no adapter expresses or diverges (PR C finding): a spec using a11y.labelledBy fails ledger-unaccounted (critical) on all 6 adapters, so a covering spec cannot pass the gates. Resolved by the D4 decision (implement, diverge or remove). Delete this entry when a corpus spec uses it.", approver: "Ssuppanut (design-system a11y owner)", expires: "2027-03-31" }
  "a11y.value:live=off": { reason: "Deferred until the F-28 lowering fix. a11y.live: off is lowered wrongly on React Native (accessibilityLiveRegion polite instead of none), Compose (LiveRegionMode.Polite instead of omitting liveRegion) and SwiftUI (.updatesFrequently, the same trait as every other value), and no gate checks the live value (the ledger counts it as expressed, a11y-guard only checks that a live-region trait exists). A live-region-off spec returns together with the F-28 fix; delete this entry then.", approver: "Ssuppanut (design-system a11y owner)", expires: "2027-03-31" }
  "input.value:inputType=email": { reason: "No corpus spec sets inputType: email. Web emits type=\"email\" from inputType, but React Native, SwiftUI and Compose only consult inputType === \"number\" and ignore email (no keyboard type). Native lowering of inputType is pending D7; backfill after D7 so the spec asserts the native behaviour.", approver: "Ssuppanut (design-system a11y owner)", expires: "2027-03-31" }
  "input.value:inputType=password": { reason: "No corpus spec sets inputType: password. Web emits type=\"password\" (masked), but React Native, SwiftUI and Compose ignore inputType other than number, so the field is plain text on all natives. Pending the D7 decision on inputType on native; backfill after D7.", approver: "Ssuppanut (design-system a11y owner)", expires: "2027-03-31" }
  "input.value:inputType=checkbox": { reason: "No corpus spec sets inputType: checkbox. Checkbox controls in the corpus use input.state.kind: boolean (no inputType), and the native adapters ignore inputType other than number. Pending the D7 decision on inputType on native; backfill after D7.", approver: "Ssuppanut (design-system a11y owner)", expires: "2027-03-31" }
  "style-slot:font": { reason: "No corpus spec sets the font style slot. It is recognized only by the react, vue and svelte STYLE_PROP tables (font-family); React Native, SwiftUI and Compose do not lower it. It needs a native-lowering decision (D6 area) before a covering spec is meaningful.", approver: "Ssuppanut (design-system a11y owner)", expires: "2027-03-31" }
  "style-slot:fontSize": { reason: "No corpus spec sets the fontSize style slot. It is recognized by react, vue, svelte and react-native STYLE_PROP; SwiftUI and Compose drop it silently (not in MODIFIER or the Compose modifier chain). It needs a native-lowering decision (D6 area) before a covering spec is meaningful.", approver: "Ssuppanut (design-system a11y owner)", expires: "2027-03-31" }
