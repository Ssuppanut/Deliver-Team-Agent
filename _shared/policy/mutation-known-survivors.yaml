# Known surviving mutants of the gate mutation harness (_shared/scripts/mutate-gates.mjs).
#
# A surviving mutant is a proven blind spot: an injected defect that left every gate GREEN. Known blind spots are
# logged here so the harness stays a regression detector: it fails on any NEW survivor and on any entry that no
# longer matches a survivor. Loader and rules: _shared/scripts/mutation-known-survivors.mjs.
#
# Entry fields (all required, no others allowed):
#   operator   exact mutation operator id (see OPERATORS in mutate-gates.mjs)
#   feature    exact corpus feature name, or "*" only where EVERY feature of that operator and adapter survives
#   adapter    exact adapter (react, vue, svelte, react-native, swiftui, compose), or "*" (also for operators
#              that are not adapter specific)
#   cluster    the audit cluster (CL-01 .. CL-10 in docs/audits/F-28-value-lowering-audit.md) the construct
#              belongs to, recorded as context only; "none-gate-gap" when no audit defect is behind the blind
#              spot. The cluster does not decide when an entry is removed.
#   reason     non-empty and specific: which gate is missing
#   approver   exactly "Ssuppanut (design-system a11y owner)"
#   expires    quoted YYYY-MM-DD; an entry is already past ON its expiry date (not inclusive), like the waivers
#
# Rules (stable ids):
#   M0 load            file missing/unparseable, no `survivors` list, unknown or missing field
#   M1 new survivor    a surviving mutant matches no entry
#   M2 stale entry     an entry is the best match of no surviving mutant (no mutant at all, or all now killed):
#                      DELETE THE ENTRY
#   M3 entry quality   empty reason, wrong approver, bad or past expiry, invalid cluster, duplicate scope
#   M4 over-broad      the scope also matches KILLED mutants of the same operator: narrow it
#
# To add an entry: only for a survivor that is a known gate gap; scope it as narrowly as the real survivors allow
# and never use an operator-wide "*"/"*" pair.
#
# Burn-down: an entry is removed only when a gate checks the emitted value for that construct and kills the
# mutant. Fixing the underlying defect alone does not kill a mutant; it only makes a correct expected value
# possible. The planned way to burn entries down is a value-lowering gate (a generalization of
# check-live-lowering with a documented expected-value table); cluster fixes add rows to it. When a gate starts
# killing the mutants, the harness reports "delete this entry" (M2); remove the line in the PR that adds that
# check.
version: 1
survivors:
