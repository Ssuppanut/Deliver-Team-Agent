# Trait registry — maps every output-affecting design-spec construct to the
# Lowering-Ledger trait that accounts for it, or to an explicit, expiring
# "untracked" exemption. D1 scaffold: structure + seed only; the CI gate that
# enforces it is D2.
#
# Construct ids are derived from design-spec.schema.yaml (+ style slots) by
# _shared/scripts/schema-constructs.mjs — see its header for the id format.
# Never hand-add a construct that the walker does not derive (orphan), and
# never leave a derived construct without an entry.
#
# Entry shapes (reason/approver/expires reuse _shared/policy/a11y-waivers.json):
#   "<construct-id>": { trait: <normalized-ledger-trait-id> }
#   "<construct-id>": { untracked: { reason, approver, expires } }
#
# Trait ids are NORMALIZED: everything after the first "=" is "*"
# (role=*, a11y.live=*, orientation=*, state=*). A `trait` must be both declared
# in RendererBase.declaredTraits and expressed/diverged by at least one adapter;
# a declared-but-unhandled trait (a11y.labelledBy) is never "covered".
#
# NOTE (D4): orientation=* is ONE trait that conflates the semantic
# aria-orientation (web) and the layout axis (all 6). The D4 split has no
# separate construct id, so element.field:orientation maps to the existing trait.
version: 1
