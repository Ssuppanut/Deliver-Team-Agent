# UX/UI workflow — the process (WHEN/in what sequence), declarative and
# conditional. Stages map to agents (WHO) and artifacts (WHAT). Gates are
# configurable per project; `condition` allows skipping stages. This is NOT a
# rigid single pipeline — a small UI-only task skips research; an existing design
# system is reused rather than rebuilt.
version: 1
id: ux-ui
description: UX/UI Agent Team delivery process, from request to handoff.

# Approval gates are opt-in per stage via `gate:`; a project profile below turns
# them on/off. A gate that is enabled blocks progression until approved.
profiles:
  full-product:   { gates: [requirement, research, ux, ui, design-system, prototype, handoff] }
  ui-only:        { gates: [ui, handoff] }
  design-only:    { gates: [ui, design-system] }   # no engineering/QA of code
  default:        { gates: [ui, handoff] }

stages:
  - id: intake
    agent: orchestrator
    produces: [brief]
    condition: always

  - id: product-strategy
    agent: product-ux-strategist
    consumes: [brief]
    produces: [product-spec]
    gate: requirement
    condition: "new-product or unclear-requirements"

  - id: research
    agent: ux-researcher
    consumes: [product-spec, brief]
    produces: [research-report]
    gate: research
    condition: "new-product or research-requested"     # skipped for small UI-only tasks

  - id: ux-design
    agent: ux-designer
    consumes: [research-report, product-spec]
    produces: [ux-spec]
    gate: ux
    condition: "not design-spec-provided"

  - id: ui-design
    agent: ui-designer
    consumes: [ux-spec]
    produces: [design-spec]
    gate: ui
    condition: always

  - id: design-system
    agent: design-system
    consumes: [design-spec]
    produces: [design-tokens, component-contracts]
    gate: design-system
    condition: "not reuse-existing-design-system"      # reuse first, extend only if needed

  - id: engineering
    agent: ux-ui-engineer
    consumes: [design-spec, design-tokens, component-contracts]
    produces: [prototype]
    gate: prototype
    condition: "not design-only"                       # skipped when output is design-only

  - id: design-qa
    agent: design-qa
    consumes: [prototype, design-spec]
    produces: [design-qa-report]
    condition: "engineering-ran"
    repeatable: true                                   # re-runs after every change

  - id: handoff
    agent: ux-ui-engineer
    consumes: [prototype, design-qa-report]
    produces: [handoff]
    gate: handoff
    condition: always

# The existing engine (spec-to-ir -> 6 adapters -> guards -> parity) implements
# the ui-design -> engineering -> design-qa slice today. Upstream stages
# (strategy/research/ux) are defined extension points with owners and artifacts.
implemented_slice: [ui-design, engineering, design-qa, handoff]
